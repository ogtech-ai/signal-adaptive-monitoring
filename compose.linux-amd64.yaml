# Use together with compose.yaml on the approved Linux amd64 host.
services:
  signal:
    platform: linux/amd64
    image: signal-adaptive-monitoring:linux-amd64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
